[package]
name = "snens"
version = "0.2.4"
edition = "2021"
default-run = "snens"

[dependencies]
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time", "process", "io-util", "fs", "signal", "net", "sync"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "stream", "rustls-tls"] }
futures-util = "0.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
base64 = "0.22"
toml = "0.8"
# Правка конфига как документа: комментарии, порядок полей и многострочные
# строки человека остаются на месте (см. src/cfg_edit.rs).
toml_edit = "0.22"
axum = "0.8"
# CORS для парного клиента: браузер с другого origin (веб-клиент на другом
# устройстве) иначе не достучится до API. Тянем только эту часть tower-http —
# она уже есть в дереве через reqwest, новых зависимостей не добавляется.
# `fs` — чтобы ядро само отдавало собранный веб-клиент: в десктопной поставке
# отдельный vite/npx не нужен, а один процесс проще запускать и обновлять.
tower-http = { version = "0.6", features = ["cors", "fs"] }
tokio-stream = { version = "0.1", features = ["sync"] }
fs2 = "0.4"
rusqlite = { version = "0.32", features = ["bundled"] }
uuid = { version = "1", features = ["v4", "serde"] }
sha2 = "0.10"

# Только unix: фоновое ревью отвязывается от терминала своей сессией процесса
# (`setsid`) — это значение платформенной ветки, не общая зависимость.
[target.'cfg(unix)'.dependencies]
libc = "0.2"

# Тулы — отдельные crate'ы: каждый остаётся самостоятельным будущим репозиторием,
# а ядро не тащит зависимости тулов. Бинарники на место кладёт `snens build
# [<тул>…]` (он же зовёт cargo) — установка не зависит от отдельного скрипта.
[workspace]
# Плагин долгой памяти — тоже член workspace: память входит в поставку, и
# установщик должен получить её бинарь той же командой, что и остальные тулы.
members = ["web", "tools/agent", "tools/audit", "tools/cdp", "tools/desk", "tools/edit", "tools/fetch", "tools/grep", "tools/genui", "tools/memory", "tools/read", "tools/search", "tools/shot", "tools/view", "tools/web", "tools/write"]
resolver = "2"

# Релизные сборки тулов: размер и старт важнее скорости компиляции — бинарь
# уезжает в установщик. Профиль один на весь workspace (в крейтах тулов он не
# задаётся, иначе cargo его игнорирует).
[profile.release]
lto = true
codegen-units = 1
strip = true
