[package]
name = "snens"
version = "0.1.0"
edition = "2021"

[dependencies]
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time", "process", "io-util", "fs", "signal"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "stream", "rustls-tls"] }
futures-util = "0.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
rustyline = { version = "18.0.1", features = ["with-file-history"] }

# Тулы — отдельные crate'ы: каждый остаётся самостоятельным будущим репозиторием,
# а ядро не тащит зависимости тулов. Бинарники кладёт на место tools/build.sh.
[workspace]
members = ["tools/*"]
resolver = "2"
