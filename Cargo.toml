[package]
name = "snens"
version = "0.1.0"
edition = "2021"
default-run = "snens"

[features]
surface-next = []

[[bin]]
name = "snens-next"
path = "src/next_main.rs"
required-features = ["surface-next"]

[dependencies]
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time", "process", "io-util", "fs", "signal", "net", "sync"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "stream", "rustls-tls"] }
futures-util = "0.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
base64 = "0.22"
toml = "0.8"
axum = "0.8"
tokio-stream = { version = "0.1", features = ["sync"] }
fs2 = "0.4"
rusqlite = { version = "0.32", features = ["bundled"] }
uuid = { version = "1", features = ["v4", "serde"] }
sha2 = "0.10"

# Только unix: фоновое ревью отвязывается от терминала своей сессией процесса
# (`setsid`) — это значение платформенной ветки, не общая зависимость.
[target.'cfg(unix)'.dependencies]
libc = "0.2"

# Тулы — отдельные crate'ы: каждый остаётся самостоятельным будущим репозиторием,
# а ядро не тащит зависимости тулов. Бинарники кладёт на место tools/build.sh.
[workspace]
members = ["tools/agent", "tools/audit", "tools/edit", "tools/fetch", "tools/read", "tools/search", "tools/view", "tools/write"]
# tools/memory — отдельный репозиторий ~/projects/snens-memory: он подключается
# симлинком tools/memory/memory, а не как член workspace (иначе его сборка
# перезаписывает бинарь плагина).
resolver = "2"
