# snens.svuvi.ch — один домен на весь продукт: лендинг, документация, релизы.
# Старые docs.svuvi.ch и releases.svuvi.ch уводятся 301 на те же пути нового
# домена: сплошной редирект дешевле, чем жить с тремя именами одного сайта.
#
# Вставлять в конец /etc/caddy/Caddyfile (правит человек, root), затем
# `caddy adapt --config /etc/caddy/Caddyfile --adapter caddyfile >/dev/null` и
# `sudo systemctl reload caddy`.
#
# ВАЖНО: блок обязан быть многострочным. Однострочная запись
# `docs.svuvi.ch { redir ... }` роняет парсер Caddy («Unexpected '}'
# because no matching opening brace») — проверка синтаксиса это ловит, а
# systemctl reload только сообщает «Job for caddy.service failed».

snens.svuvi.ch {
	root * /var/www/snens.svuvi.ch
	handle_path /releases/* {
		root * /var/www/snens.svuvi.ch/releases
		file_server
	}
	file_server

	# Документация правится ходом, ей хватает минуты.
	@docs path /docs/* /llm/* /style.css /
	header @docs Cache-Control "max-age=60"

	# Манифест апдейтера читается при каждом старте приложения: пять минут —
	# новый релиз подхватывается не мгновенно, но и не висит вечно в кеше.
	@releases path /releases/*
	header @releases Cache-Control "max-age=300"
}

# Старые имена. Пути совпадают, поэтому редирект — на тот же путь нового домена.
docs.svuvi.ch {
	handle {
		redir https://snens.svuvi.ch/llm{uri} permanent
	}
}

releases.svuvi.ch {
	handle {
		redir https://snens.svuvi.ch/releases{uri} permanent
	}
}
