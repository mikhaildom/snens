[package]
name = "snens-memory"
version = "0.1.0"
edition = "2021"
description = "Долгая память агента: один бинарь, один SQLite (FTS5 + sqlite-vec), без демона"
license = "MIT"
repository = "https://git.svuvi.ch/svuvich/snens-memory"
readme = "README.md"
# Копия отдельного репозитория snens-memory: публикация отсюда не должна
# уезжать под тем же именем в crates.io.
publish = false

[[bin]]
name = "memory"
path = "src/main.rs"

[dependencies]
rusqlite = { version = "0.32", features = ["bundled"] }
sqlite-vec = "0.1.9"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls"] }

# Профиля здесь нет: в workspace он задаётся в корневом Cargo.toml, иначе
# cargo предупреждает и молча игнорирует эти значения при сборке из корня.
