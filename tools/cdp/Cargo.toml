[package]
name = "cdp"
version = "0.1.0"
edition = "2021"

# Общая часть тулов, которые работают с headless Chrome: запуск браузера,
# сокет CDP, кадры, канал вложений. Своя библиотека, а не копия в каждом туле:
# `shot` и `genui` обязаны видеть страницу одинаково — иначе проверка артефакта
# врёт про то, что видит человек.
[dependencies]
serde_json = "1"
# Только ws://127.0.0.1 — TLS-фичи крейта не нужны.
tungstenite = "0.30"
