[package]
name = "genui"
version = "0.1.0"
edition = "2021"

# Интерфейсные артефакты: список библиотеки компонентов, скелет, проверка.
# Проверка идёт через общий `cdp` с тем же запуском Chrome, что у `shot`: иначе
# «у модели работает, у человека нет».
[dependencies]
serde_json = "1"
cdp = { path = "../cdp" }
