[package]
name = "agent"
version = "0.1.0"
edition = "2021"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"

[target.'cfg(unix)'.dependencies]
# signal(3): вернуть дефолтный SIGPIPE, иначе `agent list | head` падает паникой
# «failed printing to stdout». Своя extern-декларация с захардкоженным 13 и
# голым usize работала по счастливой случайности ABI.
libc = "0.2"